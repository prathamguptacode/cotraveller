server {
    listen 80;
    listen [::]:80;

    server_name cotraveller.app www.cotraveller.app;

    return 301 https://cotraveller.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.cotraveller.app;

    ssl_certificate /etc/letsencrypt/live/cotraveller.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cotraveller.app/privkey.pem;

    return 301 https://cotraveller.app$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cotraveller.app;

    ssl_certificate /etc/letsencrypt/live/cotraveller.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cotraveller.app/privkey.pem;

    client_max_body_size 25M;

    location / {
        root /home/azureuser/web/dist;
        try_files $uri $uri/ /index.html =404;
    }


    location /api/ {
        proxy_pass http://localhost:8080 ;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }


    location /socket.io/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}